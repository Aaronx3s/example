name: Build EXE  # 任务名称

on:
  push:
    branches: [ "main" ]  # 当推送到 main 分支时触发
  workflow_dispatch:      # 允许手动点击按钮触发

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 服务器

    steps:
    # 1. 拉取你的代码
    - uses: actions/checkout@v3

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    # 3. 安装依赖库
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl xlrd pyinstaller

    # 4. 执行打包命令
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name "多表合并工具" merge_tool.py

    # 5. 上传成果 (修复后的关键步骤)
    - name: Upload EXE
      uses: actions/upload-artifact@v3
      with:
        name: MyExcelTool  # 下载时的文件名
        path: dist/多表合并工具.exe  # 指定打包好的文件路径
